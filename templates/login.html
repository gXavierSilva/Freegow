<!DOCTYPE html>
<html lang="pt-BR" x-data="appTheme" :class="{ 'dark': darkMode }">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - ClinicSoft</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚕️</text></svg>">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Alpine.js for interactivity -->
    <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js" defer></script>

    <script>
        // Configure Tailwind to use the 'class' strategy for dark mode
        tailwind.config = {
            darkMode: 'class',
        }
    </script>

    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        [x-cloak] { display: none !important; }
    </style>
</head>
<body class="bg-gray-50 dark:bg-gray-900">

    <!-- Main container with login logic -->
    <div x-data="loginForm">
    
        <!-- Pop-up Notification -->
        <div 
            x-show="popup.show"
            x-cloak
            x-transition:enter="transition ease-out duration-300"
            x-transition:enter-start="opacity-0 transform -translate-y-4"
            x-transition:enter-end="opacity-100 transform translate-y-0"
            x-transition:leave="transition ease-in duration-300"
            x-transition:leave-start="opacity-100 transform translate-y-0"
            x-transition:leave-end="opacity-0 transform -translate-y-4"
            class="fixed top-5 right-5 w-full max-w-sm rounded-lg shadow-lg"
            :class="{
                'bg-green-500': popup.type === 'success',
                'bg-red-500': popup.type === 'error'
            }"
            style="z-index: 50;"
        >
            <div class="p-4 flex items-center">
                <!-- Icon -->
                <div class="mr-3">
                    <svg x-show="popup.type === 'success'" class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                    <svg x-show="popup.type === 'error'" class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2m7-2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                </div>
                <!-- Message -->
                <p class="text-white font-medium" x-text="popup.message"></p>
                <!-- Close Button -->
                <button @click="popup.show = false" class="ml-auto p-1 text-white rounded-full hover:bg-white/20 focus:outline-none">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>
        </div>

        <div class="flex min-h-screen items-center justify-center bg-gray-100 dark:bg-gray-900 py-12 px-4 sm:px-6 lg:px-8">
            <div class="relative w-full max-w-md p-8 space-y-8 bg-white dark:bg-gray-800 rounded-2xl shadow-lg">
                
                <!-- Theme Toggle Button -->
                <div class="absolute top-6 right-6">
                    <button @click="toggleDarkMode()" class="p-2 rounded-full text-gray-500 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-gray-700 focus:outline-none">
                        <svg x-show="!darkMode" class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
                        <svg x-show="darkMode" x-cloak class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path></svg>
                    </button>
                </div>

                <!-- Header -->
                <div class="text-center">
                    <a href="areadeagendamento.html" class="inline-block text-3xl font-bold text-gray-800 dark:text-white">
                        Clinic<span class="text-teal-600 dark:text-teal-400">Soft</span>
                    </a>
                    <h2 class="mt-4 text-2xl font-bold text-gray-900 dark:text-gray-200">
                        Acesse sua conta
                    </h2>
                    <p class="mt-2 text-sm text-gray-600 dark:text-gray-400">
                        Bem-vindo de volta! Por favor, insira seus dados.
                    </p>
                </div>

                <!-- Login Form -->
                <form class="mt-8 space-y-6" @submit.prevent="handleLogin">
                    <input type="hidden" name="remember" value="true">
                    <div class="rounded-md shadow-sm -space-y-px">
                        <div>
                            <label for="email-address" class="sr-only">Endereço de e-mail</label>
                            <input id="email-address" name="email" type="email" x-model="formData.email" autocomplete="email" required class="appearance-none rounded-none relative block w-full px-3 py-3 border border-gray-300 dark:border-gray-600 placeholder-gray-500 dark:placeholder-gray-400 text-gray-900 dark:text-gray-200 bg-white dark:bg-gray-700 rounded-t-md focus:outline-none focus:ring-teal-500 focus:border-teal-500 focus:z-10 sm:text-sm" placeholder="Endereço de e-mail">
                        </div>
                        <div>
                            <label for="password" class="sr-only">Senha</label>
                            <input id="password" name="password" type="password" x-model="formData.password" autocomplete="current-password" required class="appearance-none rounded-none relative block w-full px-3 py-3 border border-gray-300 dark:border-gray-600 placeholder-gray-500 dark:placeholder-gray-400 text-gray-900 dark:text-gray-200 bg-white dark:bg-gray-700 rounded-b-md focus:outline-none focus:ring-teal-500 focus:border-teal-500 focus:z-10 sm:text-sm" placeholder="Senha">
                        </div>
                    </div>

                    <div class="flex items-center justify-between">
                        <div class="flex items-center">
                            <input id="remember-me" name="remember-me" type="checkbox" class="h-4 w-4 text-teal-600 focus:ring-teal-500 border-gray-300 dark:border-gray-600 rounded dark:bg-gray-700">
                            <label for="remember-me" class="ml-2 block text-sm text-gray-900 dark:text-gray-300">
                                Lembrar-me
                            </label>
                        </div>

                        <div class="text-sm">
                            <a href="{{ url_for('pages.recovery_page') }}" class="font-medium text-teal-600 hover:text-teal-500 dark:text-teal-400 dark:hover:text-teal-300">
                                Esqueceu a senha?
                            </a>
                        </div>
                    </div>

                </form>
                <div>
                    <button onclick="handleLogin()" class="group relative w-full flex justify-center py-3 px-4 border border-transparent text-sm font-medium rounded-md text-white bg-teal-600 hover:bg-teal-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-offset-gray-100 dark:focus:ring-offset-gray-800 focus:ring-teal-500">
                        Entrar
                    </button>
                </div>
                
                <!-- Footer Link -->
                <p class="mt-6 text-center text-sm text-gray-600 dark:text-gray-400">
                    Não tem uma conta?
                    <a href="{{ url_for('pages.register_page') }}" class="font-medium text-teal-600 hover:text-teal-500 dark:text-teal-400 dark:hover:text-teal-300">
                        Crie uma agora
                    </a>
                </p>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='login.js') }}"></script>

    <script>
        // Alpine.js component for theme management
        document.addEventListener('alpine:init', () => {
            Alpine.data('appTheme', () => ({
                darkMode: localStorage.getItem('darkMode') === 'true',
                toggleDarkMode() {
                    this.darkMode = !this.darkMode;
                    localStorage.setItem('darkMode', this.darkMode);
                }
            }));

            // Alpine.js component for login form logic
            Alpine.data('loginForm', () => ({
                formData: {
                    email: '',
                    password: ''
                },
                popup: {
                    show: false,
                    message: '',
                    type: 'success' // 'success' or 'error'
                },
                
                // Function to display the popup
                displayPopup(message, type) {
                    this.popup.message = message;
                    this.popup.type = type;
                    this.popup.show = true;
                    // Automatically hide after 4 seconds
                    setTimeout(() => this.popup.show = false, 4000);
                },

                // Handle the form submission
                handleLogin() {
                    const { email, password } = this.formData;

                    // 1. Check if fields are filled
                    if (!email || !password) {
                        this.displayPopup('Por favor, preencha o e-mail e a senha.', 'error');
                        return;
                    }

                    // 2. Simulate a backend server error
                    // To test, use an email like "error@test.com"
                    if (email.toLowerCase().includes('error')) {
                        this.displayPopup('Erro ao fazer login. Tente mais tarde.', 'error');
                        return;
                    }
                    
                    // 3. Simulate correct credentials
                    // For this example, let's use user@test.com and password123
                    if (email === 'user@test.com' && password === 'password123') {
                        this.displayPopup('Login feito com sucesso!', 'success');
                        // In a real app, you would redirect here after a short delay
                        // setTimeout(() => { window.location.href = 'dashboard.html'; }, 1500);
                    } else {
                        // 4. If credentials do not match, show error
                        this.displayPopup('Credenciais incorretas', 'error');
                    }
                }
            }));
        });
    </script>
</body>
</html>
